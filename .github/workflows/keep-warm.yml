# Runs scripts/keep-warm.mjs every 5 minutes, 24/7, so nothing depends on a PC or an open browser tab.
# Settings (repo > Settings > Secrets and variables > Actions):
#   variable PING_URLS  Render URLs, space separated (the defaults below are used when it is not set)
#   secret   CRON_URL   https://your-domain/api/cron.php?key=CRON_KEY
name: Keep warm

on:
  schedule:
    # Backup only: GitHub runs schedules best effort and can skip hours of them. The reliable trigger is an
    # external cron (cron-job.org) calling workflow_dispatch every 5 minutes; see README.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: keep-warm
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: scripts
      - name: Ping sites and run the scheduler
        run: node scripts/keep-warm.mjs
        env:
          PING_URLS: ${{ vars.PING_URLS || 'https://siddheswari-pathlab.onrender.com/ https://jido-pathlabs.onrender.com/ https://jido-dukaan.onrender.com/ https://jido-sms-gateway.onrender.com/' }}
          CRON_URL: ${{ secrets.CRON_URL }}
      # GitHub turns off scheduled workflows after 60 days without a commit; re-enabling resets that clock.
      - name: Keep this schedule enabled
        if: always()
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keep-warm.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
